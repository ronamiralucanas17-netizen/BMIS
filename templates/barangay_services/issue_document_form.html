{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Issue Document for {{ resident.full_name }}</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="document_type" class="form-label">Document Type</label>
                            <select name="document_type" id="document_type" class="form-select" required>
                                <option value="">Select Document Type...</option>
                                {% for val, label in doc_types %}
                                <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="purpose" class="form-label">Purpose</label>
                            <textarea name="purpose" id="purpose" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount to Pay (PHP)</label>
                            <input type="number" step="0.01" name="amount" id="amount" class="form-control" value="0.00">
                            <small class="text-muted">Set to 0 if free.</small>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'residents:resident_detail' resident.id %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Issue Document & Generate Receipt</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
