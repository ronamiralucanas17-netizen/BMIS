{% extends 'base.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i> Confirm Delete
                    </h4>
                </div>
                <div class="card-body">
                    <p class="lead">Are you sure you want to delete the hazard area:</p>
                    <h3 class="text-center my-4">
                        <strong>{{ area.name }}</strong>
                    </h3>
                    <p class="text-muted text-center">
                        Type: {{ area.get_type_display }}<br>
                        Risk Level: {{ area.get_risk_level_display }}
                    </p>
                    <hr>
                    <p class="text-center text-danger">This action cannot be undone.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'gis_mapping:map_view' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-1"></i> Yes, Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
