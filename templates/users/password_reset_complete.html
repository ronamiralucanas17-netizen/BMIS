{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4 text-center mt-5">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
                <h3 class="mb-3">Password Reset Complete!</h3>
                <p class="text-muted">Your password has been successfully set. You can now log in with your new password.</p>
                <div class="mt-4">
                    <a href="{% url 'users:login' %}" class="btn btn-success">Login Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
