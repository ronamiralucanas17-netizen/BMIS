{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5">
            <div class="card-body">
                <h3 class="text-center mb-4"><i class="fas fa-key me-2"></i> Reset Password</h3>
                <p class="text-muted text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary mt-3">Send Reset Link</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'users:login' %}" class="text-muted">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
