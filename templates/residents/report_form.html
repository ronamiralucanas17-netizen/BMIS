{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
{{ form.media }}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-header bg-danger text-white p-3">
                <h4 class="mb-0 text-center"><i class="fas fa-exclamation-triangle me-2"></i> {{ title }}</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i> Please provide as much detail as possible to help the barangay officials address your concern.
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'residents:resident_dashboard' %}" class="btn btn-secondary mt-3">Cancel</a>
                        <button type="submit" class="btn btn-danger mt-3">Submit Report</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
