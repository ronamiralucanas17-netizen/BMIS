{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="mb-0 text-center"><i class="fas fa-user-plus me-2"></i> {{ title }}</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    This account will be created as a <strong>Barangay Staff</strong> for <strong>{{ barangay.name }}</strong>.
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'residents:staff_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Staff Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
